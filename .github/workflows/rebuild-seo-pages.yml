  name: Rebuild static SEO pages

  # artists.json/groups.json이 바뀌어 push되면 build_group_pages.js를 자동으로 돌려서
  # 그룹/멤버 정적 페이지(g/, en/g/, member/, en/member/)와 sitemap.xml을 재생성하고
  # 결과물을 다시 커밋한다. 이 워크플로우 자체가 만드는 커밋(g/, en/g/, member/, en/member/,
  # sitemap.xml만 건드림)은 트리거 경로(paths)에 안 걸려서 무한 루프로 이어지지 않는다.
  # (2026-08-21, 사용자 요청 — 데이터 수정할 때마다 로컬에서 스크립트 수동 실행하던 걸 자동화)

  on:
    push:
      branches: [main]
      paths:
        - 'artists.json'
        - 'groups.json'
        - 'build_group_pages.js'
        # og_thumbs.json도 트리거에 있어야 한다(2026-09-15). 이 파일은 공유 미리보기(og:image)의
        # 출처인데 트리거에 빠져 있어서, 썸네일 캐시를 갱신해도 **정적 페이지가 안 바뀌었다** —
        # 즉 링크를 공유하면 계속 옛 이미지(또는 기본 이미지)가 떴다.
        - 'og_thumbs.json'
        # 페이지 보강(2026-10-16) — 투어·대상·밀리언·작사작곡 파일과 보강 모듈이 바뀌어도 다시 만든다
        - 'tools/seo_extra.js'
        - 'tours_boxscore.json'
        - 'group_awards.json'
        - 'group_certifications.json'
        - 'artist_credits.json'
    # 음방 1위·조회수(DB)는 파일 변화 없이 바뀐다 → 주 1회 새로(월 KST 06:30). 바뀐 페이지만 커밋된다.
    # 매일이던 걸 주 1회로(2026-10-16) — 곡 페이지까지 생기면 매일 수천 파일이 커밋돼 저장소가 불어난다.
    # 조회수는 두 자리로 반올림해 써서(roundViews) 작은 변동엔 파일이 안 바뀐다.
    schedule:
      - cron: '30 21 * * 0'
    workflow_dispatch:

  permissions:
    contents: write

  # 데이터 커밋을 연달아 push하면 이 워크플로우가 여러 개 동시에 돌면서 서로의 push를 밀어낸다.
  # 한 번에 하나만 돌리고, 밀린 건 어차피 최신 데이터로 다시 빌드하면 되니 취소한다(2026-09-02).
  concurrency:
    group: rebuild-seo-pages
    cancel-in-progress: true

  jobs:
    rebuild:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-node@v4
          with:
            node-version: 22

        - name: Build and push (경합 시 최신 main 위에서 재빌드)
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # 예전엔 "빌드 → commit → pull --rebase → push" 순서였는데, 그 사이 다른 커밋이 올라오면
            # rebase가 같은 산출물 파일을 두고 충돌하거나 push가 거부돼 exit 128로 죽었다(2026-09-02,
            # 데이터 커밋 4개를 연달아 push한 날 전부 실패). 생성물은 소스에서 언제든 다시 만들 수 있으니
            # 재시도 때마다 최신 main으로 리셋하고 처음부터 빌드한다 — 충돌 자체가 생기지 않는다.
            for i in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              # 새로 등록한 그룹·멤버의 공유 썸네일 빈 곳을 먼저 채운다(2026-10-19 — 예전엔 주 1회 갱신이라 A2O LITE·SOUL이 며칠 기본 이미지).
              # 이미 있는 값은 그대로(--keep-existing), maxres 확인 생략(--no-probe). 실패해도 페이지 빌드는 계속.
              node tools/build_og_thumbs.mjs --keep-existing --no-probe || echo "썸네일 채우기 실패 — 기존 값으로 빌드"
              node build_group_pages.js || exit 1
              # ⚠️ 2026-10-01: 예전 줄은 `git add g/ … collab/ en/collab/ …` 였는데 콜라보 페이지가 꺼져 있어 collab/ 폴더가 **없다**
              #    → pathspec 오류로 1·2번째 add가 통째로 실패하고 3번째(g/ en/g/ sitemap.xml만)로 떨어졌다. 그래서 멤버 페이지
              #    변경과 커버 페이지 **삭제**가 한 번도 커밋되지 않았고(cover/애프터스쿨 고아 → static-links 빨간불), 조용히 쌓였다.
              #    있는 경로만 골라 -A로 올린다(삭제 포함).
              git add -A -- $(for p in g en/g member en/member cover en/cover collab en/collab sitemap.xml og_thumbs.json; do [ -e "$p" ] && echo "$p"; done)
              if git diff --cached --quiet; then
                echo "변경된 정적 페이지 없음"
                exit 0
              fi
              git commit -m "chore: rebuild static SEO pages (auto)"
              if git push; then
                echo "push 성공 (시도 $i)"
                exit 0
              fi
              echo "push 경합 — 최신 main 위에서 재시도 ($i/3)"
              sleep $((i * 5))
            done
            echo "3회 재시도 후에도 push 실패"
            exit 1
