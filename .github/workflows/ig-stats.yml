name: 인스타 공식 계정 정보 수집 (2시간마다)

# tools/ig_business_discovery.mjs — Business Discovery API로 아이돌 인스타 프로필 사진·팔로워·게시물 수를 DB(ig_accounts·
# ig_follower_daily)에 쌓는다(2026-10-19). 회당 최대 180개, 실제 API 사용량에 따라 조기 종료한다.
# 최근 7일 활동 계정(4시간 이상 미갱신) 우선 슬롯 + 기존 전체 순환 + 신규 계정을 앞부분부터 섞는다.
# 2시간은 예약 간격이며 GitHub 스케줄 지연·API 한도에 따라 전체 계정 갱신에는 더 오래 걸릴 수 있다.
# 실패(빨간불)는 대개 토큰 만료(60일) — Secrets의 META_IG_TOKEN을 새로 발급해 넣을 것(방법은 CHANGELOG 10-19).

on:
  schedule:
    - cron: '23 */2 * * *'   # 2시간마다 :23 — 라운드 분 회피
  push:
    branches: [main]
    paths: ['ig_media_accounts.json']   # 공식 외 계정 목록을 바꾸면 바로 한 번(2026-10-20 — 새 계정이 실제로 있는지 확인)
  workflow_dispatch:
    inputs:
      max:
        description: "이번 회차 최대 계정 수"
        required: false
        default: '180'
      only:
        description: "이 핸들 하나만(시험용)"
        required: false
        default: ''

concurrency:
  group: ig-stats
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 수집
        shell: bash
        env:
          META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          IG_MAX: ${{ github.event.inputs.max || '180' }}
        run: |
          set -o pipefail
          if [ -n "${{ github.event.inputs.only }}" ]; then ARG="--only=${{ github.event.inputs.only }}"; fi
          # DB·네트워크 일시 장애(fetch failed·5xx·타임아웃)는 다음 회차에 이어지므로 경고만 — 토큰 만료·앱 차단·코드 오류는 그대로 실패(메일)(2026-11-13)
          set +e
          node tools/ig_business_discovery.mjs $ARG > /tmp/out.txt 2>&1; code=$?
          cat /tmp/out.txt | tee -a "$GITHUB_STEP_SUMMARY"
          if [ $code -ne 0 ] && ! grep -qE "토큰 만료|차단|권한 오류" /tmp/out.txt && grep -qiE "fetch failed|Failed to fetch|HeadersTimeout|ETIMEDOUT|ECONNRESET|저장 실패 5[0-9][0-9]|조회 실패 5[0-9][0-9]" /tmp/out.txt; then echo "::warning title=일시적 실패::다음 회차에 이어서 진행"; exit 0; fi
          exit $code
