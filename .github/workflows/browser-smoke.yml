name: Browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.json'
      - 'disco/**'
      - 'vendor/**'
      - 'tests/smoke.test.js'
      - 'tests/vid-list-share.test.js'
      - 'tests/ig-photo-tags-ui.test.js'
      - 'tests/desktop-close-layers.test.js'
      - 'tests/lb-every-entry.test.js'
      - 'tests/stage-venue-album.test.js'
      - 'tests/deeplink-song.test.js'
      - 'tests/phone-landscape.test.js'
      - 'tests/mobile-first-visit.test.js'
      - 'tests/compass-width.test.js'
      - 'tests/vid-stage.test.js'
      - 'tests/panel-flow.test.js'
      - 'tests/star-cursor.test.js'
      - 'tests/program-facets.test.js'
      - 'tests/fixtures/**'
      - 'tools/browser_test_runtime.cjs'
      - '.github/workflows/browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.json'
      - 'disco/**'
      - 'vendor/**'
      - 'tests/smoke.test.js'
      - 'tests/vid-list-share.test.js'
      - 'tests/ig-photo-tags-ui.test.js'
      - 'tests/desktop-close-layers.test.js'
      - 'tests/lb-every-entry.test.js'
      - 'tests/stage-venue-album.test.js'
      - 'tests/deeplink-song.test.js'
      - 'tests/phone-landscape.test.js'
      - 'tests/mobile-first-visit.test.js'
      - 'tests/compass-width.test.js'
      - 'tests/vid-stage.test.js'
      - 'tests/panel-flow.test.js'
      - 'tests/star-cursor.test.js'
      - 'tests/program-facets.test.js'
      - 'tests/fixtures/**'
      - 'tools/browser_test_runtime.cjs'
      - '.github/workflows/browser-smoke.yml'

permissions:
  contents: read

# concurrency 취소 제거(2026-11-19): 연속 푸시마다 이전 run이 cancelled로 끝나며 'Run failed' 메일이 하루 수십 통 왔다
# (11-19 실측: 최근 100 run 중 진짜 실패 1, cancelled 31). 공개 저장소라 러너 분이 무료이므로 전부 끝까지 돌린다 —
# 취소 메일 0, 각 커밋의 결과도 남는다. (pages-build-deployment의 취소는 GitHub 관리 워크플로라 여기선 못 바꾼다.)

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check runner Chromium
        run: /usr/bin/google-chrome --version
      - name: Desktop and fresh mobile smoke
        env:
          KPU_BROWSER_PATH: /usr/bin/google-chrome
        # 라이브 데이터 응답이 느린 순간(카드 영상 20초 대기 초과 등)엔 한 번 더 — 두 번 다 실패할 때만 실패(메일)(2026-11-13)
        run: node tests/smoke.test.js || { echo "::warning title=스모크 재시도::첫 실행 실패 — 30초 뒤 한 번 더"; sleep 30; node tests/smoke.test.js; }

  flows:
    name: browser (${{ matrix.suite }}${{ matrix.lang && format(' {0}', matrix.lang) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - suite: vid-list-share
          - suite: ig-photo-tags-ui
          - suite: desktop-close-layers
          - suite: lb-every-entry
          - suite: stage-venue-album
          - suite: deeplink-song
          - suite: phone-landscape
          - suite: mobile-first-visit
          - suite: compass-width
          - suite: vid-stage
          - suite: panel-flow
          - suite: star-cursor
          - suite: program-facets
            lang: ko
          - suite: program-facets
            lang: en
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check runner Chromium
        run: /usr/bin/google-chrome --version
      - name: Browser user flow
        env:
          KPU_TEST_LANG: ${{ matrix.lang }}
          KPU_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/kpu-first-visit-artifacts
        run: node tests/${{ matrix.suite }}.test.js || { echo "::warning title=재시도::첫 실행 실패 — 30초 뒤 한 번 더"; sleep 30; node tests/${{ matrix.suite }}.test.js; }
      - name: Upload first-visit screenshots
        if: always() && matrix.suite == 'mobile-first-visit'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-first-visit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kpu-first-visit-artifacts
          if-no-files-found: ignore
          retention-days: 3
