name: 앨범 ↔ 영상 목록 갱신 (주간)

# tools/build_album_videos.mjs — 앨범 카드 영상 패널이 읽는 album_videos/*.json을 다시 만든다(2026-10-19).
# 연결은 신규 영상 말고는 거의 안 바뀌는 정보라 **주 1회**(사용자 판단, 2026-10-19). 그 사이 신규 영상은 앱이 _meta.json
# 시각 이후분만 따로 조회해 덧붙인다 — 실측(10-19) 7일치가 큰 그룹도 600개·86KB·1.3초(매일이면 100개·0.2초), 목록은 먼저 뜬다.
# 주간 재계산이 잡는 건 숨김·오태깅 정정·곡 연결 규칙 변경·새 앨범의 앨범명 매칭. 곡 키(song_keys)는 매일 루틴 10단계가 박으니 루틴 회차(3시간마다 정각) 사이 분에 돈다.

on:
  schedule:
    - cron: '37 19 * * 0'   # 매주 월요일 KST 04:37 — 라운드 분 회피
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: album-videos
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 빌드 + 커밋 (경합 시 최신 main 위에서 재빌드)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node tools/build_album_videos.mjs | tee -a "$GITHUB_STEP_SUMMARY" || exit 1
            git add -A album_videos/
            # _meta.json(만든 시각)만 바뀐 날도 커밋한다 — 앱이 "이 시각 이후 신규"만 조회하므로 시각이 묵으면 조회가 커진다
            if git diff --cached --quiet; then
              echo "변경 없음"
              exit 0
            fi
            git commit -m "data(album-videos): 앨범 ↔ 영상 목록 갱신 (auto)"
            if git push; then
              echo "push 성공 (시도 $i)"
              exit 0
            fi
            echo "push 경합 — 재시도 ($i/3)"
            sleep $((i * 5))
          done
          exit 1
