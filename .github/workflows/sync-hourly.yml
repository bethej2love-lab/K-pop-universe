name: 영상 동기화 (게이트 방식)

# 유튜브 신규 영상 수집(루틴 1~3단계)만 돌린다 — 2026-09-14 사용자 요청("동기화 1시간마다로").
#
# ── 2026-09-15: cron만으로는 매시간이 안 지켜져서 게이트 방식으로 바꿨다 ──────────
# 실측(2026-09-14 06:50Z~23:20Z, 약 17시간): `cron: '30 * * * *'`로 매시간을 의도했는데 실제 실행은
# **4번**뿐이었다(06:50Z / 14:20Z 실패 / 19:32Z / 23:20Z). GitHub의 schedule 이벤트는 고부하 시
# 지연되거나 통째로 드랍된다 — 우리가 고칠 수 없다.
#   → **cron은 15분마다 4번 쏘고, 실제로 돌릴지는 tools/sync_gate.mjs가 결정**한다.
#     4발 중 하나만 살아남아도 그 시간대 동기화는 보장된다(드랍 확률 p → p⁴).
#     게이트는 "마지막 동기화로부터 최소 N분"을 강제하고, N을 **시간대별로** 다르게 준다:
#       KST 17~23시 45분 · 00시 60분 · 09~16시 90분 · 01~08시 240분
#     실측 업로드 분포(최근 14일 3,928건)가 저녁 피크 66% / 새벽 02~08시 0.7%라서다. 쿼터 비용은
#     새 영상 유무와 무관하게 폴링당 동일하므로, 새벽 폴링을 줄여 저녁에 몰아주는 게 같은 예산으로
#     체감 신선도를 올리는 길이다. 근거와 상한 계산은 tools/sync_gate.mjs 머리 주석에 다 있다.
#     상한 ≤ 19회/일 × 350 units = 6,650 (+ daily-routine 2,800 = 9,450 < 한도 10,000).
#
# 왜 daily-routine.yml의 cron만 1시간으로 안 바꿨나:
#   그 워크플로는 동기화 + 37만 행을 훑는 스윕(멤버 태깅·오태깅 재검증·원곡·음방1위·포맷 태깅)이
#   한 덩어리다. 통째로 매시간 돌리면 ①같은 스윕이 하루 24번 반복되고(증분 스코프가 있어도 조회
#   자체가 비쌈) ②YouTube Data API 쿼터가 빠듯해진다.
#   쿼터 계산(호출당 1점): 공식 채널 playlistItems ~222 + 외부 채널 ~60 + 조회수 갱신 ~70 ≈ 350/회.
#   매시간이면 8,400/일로 한도 10,000의 84%다. 스윕까지 얹으면 여유가 없다.
#   → 매시간은 **동기화만**(MODE=sync), 스윕 포함 전체는 daily-routine.yml이 3시간마다.
#
# concurrency 그룹을 daily-routine과 **공유**한다. 둘은 같은 크롬 프로필(actions/cache)에 있는
# 체크포인트(kpu_yt_last_*·kpu_adm_*)를 읽고 쓰므로 동시에 돌면 서로의 진행을 덮어쓴다.
# 전체 루틴이 도는 동안 이 워크플로는 대기하다가(오래 걸리면 더 새 실행에 밀려 취소됨) 다음 시각에
# 다시 온다 — 건너뛴 시간만큼은 그 다음 동기화가 한꺼번에 가져오므로 유실은 없다(sinceId 체크포인트).

on:
  schedule:
    # 15분 간격 4발. 드랍 보험이지 "15분마다 동기화"가 아니다 — 실제 실행 여부는 게이트가 정한다.
    # 라운드 분(:00/:30)은 GitHub 부하가 몰려 드랍이 잦으므로 어긋난 분을 쓴다.
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "게이트 무시하고 무조건 동기화"
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-routine
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # 동기화만이라 평소 몇 분. 이 시간을 넘기면 다음 시각 실행에 맡긴다.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 게이트가 먼저. 건너뛰기로 판정되면 아래 스텝이 전부 스킵되어 20초 만에 끝난다
      # (크롬 설치·캐시 복원도 안 한다 — 공개 레포라 Actions 분은 무료지만 큐를 점유하지 않는 게 낫다).
      - name: 동기화 게이트
        id: gate
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
        run: node tools/sync_gate.mjs

      - name: install chrome
        id: chrome
        if: steps.gate.outputs.run == 'true'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # daily-routine.yml과 **같은 캐시 키 접두사**를 쓴다 — 체크포인트를 공유해야 매시간 동기화가
      # 증분으로 돈다. 접두사가 다르면 매번 빈 프로필로 열려 채널 전체를 다시 긁는다.
      - name: restore checkpoint profile
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kpu-routine-profile
          key: kpu-routine-profile-${{ github.run_id }}
          restore-keys: |
            kpu-routine-profile-

      - name: run sync only
        if: steps.gate.outputs.run == 'true'
        env:
          KPU_ADMIN_EMAIL: ${{ secrets.KPU_ADMIN_EMAIL }}
          KPU_ADMIN_PASSWORD: ${{ secrets.KPU_ADMIN_PASSWORD }}
          KPU_YT_API_KEY: ${{ secrets.KPU_YT_API_KEY }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          PROFILE_DIR: ${{ runner.temp }}/kpu-routine-profile
          MODE: sync
          ROUTINE_TIMEOUT_MIN: '45'
        run: node tools/run_daily_routine.cjs
