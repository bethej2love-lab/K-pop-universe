name: Rebuild disco artifacts

# groups.json/artists.json이 바뀌어 push되면 tools/build_slim_data.mjs를 자동으로 돌려
# 파생물(groups.slim.json · artists.slim.json · tracks_index.json · disco/)을 재생성하고 다시 커밋한다.
#
# 왜 필요한가 (2026-09-15): 이 빌드는 **어떤 워크플로에도 안 붙어 있었다**. 즉 앨범을 추가하고
# 스크립트를 안 돌리면 원본만 바뀌고 사이트엔 반영이 안 되는데, 그걸 알려주는 장치가 하나도 없었다.
# 앞으로 앨범 수집이 매일 자동으로 돌기 시작하면(스포티파이 동기화) 이 단계가 수동으로 남아 있을 수
# 없다 — 수집이 자동인데 반영이 수동이면 "수집은 됐는데 화면엔 없는" 상태가 매일 쌓인다.
#
# 이 워크플로가 만드는 커밋은 트리거 경로(paths)에 안 걸려서 무한 루프로 이어지지 않는다
# (rebuild-seo-pages.yml과 같은 구조 — 그쪽은 g/·sitemap.xml, 여기는 slim/disco/tracks_index).

on:
  push:
    branches: [main]
    paths:
      - 'groups.json'
      - 'artists.json'
      - 'tools/build_slim_data.mjs'
  workflow_dispatch:

permissions:
  contents: write

# 데이터 커밋을 연달아 push하면 이 워크플로가 여러 개 동시에 돌면서 서로의 push를 밀어낸다.
# 밀린 건 어차피 최신 데이터로 다시 빌드하면 되니 취소한다(rebuild-seo-pages.yml과 동일한 판단).
concurrency:
  group: rebuild-disco-artifacts
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and push (경합 시 최신 main 위에서 재빌드)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 생성물은 소스에서 언제든 다시 만들 수 있으니, 재시도마다 최신 main으로 리셋하고 처음부터
          # 빌드한다 — rebase 충돌 자체가 생기지 않는다(rebuild-seo-pages.yml에서 검증된 방식).
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node tools/build_slim_data.mjs | tee -a "$GITHUB_STEP_SUMMARY" || exit 1
            # ⚠️ albums_recent.json을 빠뜨리지 말 것(2026-09-22에 추가) — 빌더가 만드는 파생물인데
            #    이 목록에 없어서, 재빌드가 돌아도 이 파일만 영영 커밋되지 않았다. disco-artifacts
            #    테스트가 "albums_recent.json (내용 다름)"으로 **구조적으로 절대 안 풀리는** 빨간불을
            #    내고 있던 원인. 빌더에 새 산출물을 추가하면 여기도 같이 고칠 것.
            git add groups.slim.json artists.slim.json tracks_index.json albums_recent.json disco/
            if git diff --cached --quiet; then
              echo "변경된 파생물 없음"
              exit 0
            fi
            git commit -m "chore: rebuild disco artifacts (auto)"
            if git push; then
              echo "push 성공 (시도 $i)"
              exit 0
            fi
            echo "push 경합 — 최신 main 위에서 재시도 ($i/3)"
            sleep $((i * 5))
          done
          echo "3회 재시도 후에도 push 실패"
          exit 1
