name: 인스타 과거 게시물 채우기 (2시간마다, 홀수 시)

# tools/ig_backfill.mjs — 계정별 과거 게시물을 페이지 넘겨 ig_media에 쌓는다(2026-11-13).
# 앱 호출 한도(시간당 ~200)를 최신 수집(ig-stats.yml, 짝수 시 :23)과 나눠 쓰려고 홀수 시 :53에 돈다.
# 전부 채우면(모든 계정 bf_done) 호출 없이 바로 끝난다. 빨간불은 대개 토큰 만료 — ig-stats.yml과 같은 META_IG_TOKEN.

on:
  schedule:
    - cron: '53 1-23/2 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: "이번 회차 최대 호출 수"
        required: false
        default: '180'
      only:
        description: "이 핸들 하나만(시험용)"
        required: false
        default: ''

concurrency:
  group: ig-stats
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 과거 게시물 채우기
        shell: bash
        env:
          META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          IG_BF_MAX: ${{ github.event.inputs.max || '180' }}
        run: |
          set -o pipefail
          if [ -n "${{ github.event.inputs.only }}" ]; then ARG="--only=${{ github.event.inputs.only }}"; fi
          # DB·네트워크 일시 장애(fetch failed·5xx·타임아웃)는 다음 회차에 이어지므로 경고만 — 토큰 만료·앱 차단·코드 오류는 그대로 실패(메일)(2026-11-13)
          set +e
          node tools/ig_backfill.mjs $ARG > /tmp/out.txt 2>&1; code=$?
          cat /tmp/out.txt | tee -a "$GITHUB_STEP_SUMMARY"
          if [ $code -ne 0 ] && ! grep -qE "토큰 만료|차단|권한 오류" /tmp/out.txt && grep -qiE "fetch failed|Failed to fetch|HeadersTimeout|ETIMEDOUT|ECONNRESET|저장 실패 5[0-9][0-9]|조회 실패 5[0-9][0-9]" /tmp/out.txt; then echo "::warning title=일시적 실패::다음 회차에 이어서 진행"; exit 0; fi
          exit $code
