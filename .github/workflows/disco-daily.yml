name: 앨범 수집 (매일)

# 디스코그래피 일일 파이프라인.
#
# 1단계 수집: 스포티파이에서 신보를 찾아 groups.json/artists.json에 넣고 커밋한다.
#   파생물(disco/·slim·tracks_index) 재생성은 그 커밋이 rebuild-disco-artifacts.yml을 깨워 자동으로 이어진다.
# 2단계 감시: 신선도 감시(tools/disco_freshness.mjs) — "수집이 멈췄다"를 아무도 안 보고 있어도
#   알아채는 장치. 임계를 넘으면 이 워크플로가 **실패**하고 기본 알림 설정이면 메일이 온다.
#   대시보드를 하나 더 만들지 않는 게 요점이다(안 보는 대시보드가 제일 나쁘다).
#   ⚠️ 수집 뒤에 둬야 한다 — 방금 넣은 결과까지 반영해서 판정해야 의미가 있다.
#
# 시각: 하루 두 번 — **KST 18:11**과 **KST 00:11** (2026-09-15 사용자 결정).
#   · 18:11 — K팝 발매는 대개 KST 18시다. 발매 직후에 바로 집는다.
#   · 00:11 — 자정 발매·해외 발매분 + 18:11에 스포티파이 반영이 늦어 놓친 것을 6시간 뒤 다시 집는다.
# ⚠️ 분이 :00이 아닌 건 실수가 아니다. GitHub의 schedule 이벤트는 정시에 부하가 몰려 **드랍이 잦다**
#    (실측: sync-hourly가 '30 * * * *'로 17시간에 4번만 돌았다). 라운드 분을 피한다.
#
# ⚠️ 정정(2026-09-15 실측): 처음엔 "스포티파이는 일일 쿼터 상한이 없다"고 적었는데 **틀렸다**.
#    신규 앱은 `/artists/{id}/albums`를 약 100회 부르면 429 + Retry-After ≈ 24시간이 떨어진다.
#    그래서 회차를 늘리는 게 공짜가 아니고, 한 회차에 도는 양도 예산으로 묶어야 한다.
#    자세한 실측은 tools/spotify_auth.mjs 머리 주석 참고.
# 한 번 밀려도 유실은 없다: 매 실행이 "우리 데이터에 없는 앨범"을 집어오고 어디까지 훑었는지 커서를
# 남기므로, 건너뛴 회차분은 다음 실행이 이어서 가져온다.

on:
  schedule:
    - cron: '11 9 * * *'    # KST 18:11 — 발매 직후
    - cron: '11 15 * * *'   # KST 00:11 — 자정/해외 발매 + 앞 회차 누락분
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disco-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 수집. 레이트리밋에 걸려 회차가 접혀도 **실패가 아니다**(설계된 동작 — 커서가 남아 다음 회차가
      # 이어받는다). 진짜 실패(인증 오류 등)만 예외로 터져 나와 이 스텝을 빨갛게 만든다.
      - name: 스포티파이 신보 수집
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          BUDGET: ${{ vars.SPOTIFY_BUDGET || '80' }}
          # 과거 연도 1회 백필 — 대상마다 딱 한 번 더 훑어서 지난해 구멍을 메운다(기본 2025).
          # 다 메워지면(리포트의 "남은 대상 0") 레포 변수 SPOTIFY_BACKFILL_YEARS를 빈 값으로 두면 꺼진다.
          BACKFILL_YEARS: ${{ vars.SPOTIFY_BACKFILL_YEARS || '2023,2024,2025' }}
        run: node tools/spotify_disco_sync.mjs

      # 수집 결과를 커밋. 여기서 push된 groups.json/artists.json이 rebuild-disco-artifacts.yml을
      # 깨워 disco/·slim·tracks_index를 자동 재생성한다(수집은 자동인데 반영이 수동이면 의미가 없다).
      - name: 수집분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add groups.json artists.json spotify_artist_map.json spotify_sync_state.json
          if git diff --cached --quiet; then
            echo "새 앨범 없음 — 커밋할 것이 없습니다"
            exit 0
          fi
          git commit -m "data(disco): 스포티파이 신보 수집 (auto)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push 경합 — 재시도 ($i/3)"; sleep $((i * 5))
          done
          exit 1

      # ⚠️ 감시는 커밋 뒤에. 방금 수집한 결과까지 반영해서 판정해야 한다.
      - name: 신선도 감시
        run: node tools/disco_freshness.mjs
