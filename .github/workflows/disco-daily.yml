name: 앨범 수집 (매일)

# 디스코그래피 일일 파이프라인.
#
# 지금 들어 있는 것: 신선도 감시(tools/disco_freshness.mjs) — "앨범 수집이 멈췄다"를 아무도 안 보고
# 있어도 알아채는 장치. 임계를 넘으면 이 워크플로가 **실패**하고, 기본 알림 설정이면 메일이 온다.
# 대시보드를 하나 더 만들지 않는 게 요점이다(안 보는 대시보드가 제일 나쁘다).
#
# 곧 들어올 것: 스포티파이 신보 동기화(SPOTIFY_CLIENT_ID/SECRET 시크릿이 등록되면).
#   수집 → groups.json/artists.json 갱신 → 커밋 순서로 이 잡 앞에 붙는다. 파생물(disco/·slim·
#   tracks_index) 재생성은 그 커밋이 rebuild-disco-artifacts.yml을 깨워서 자동으로 이어진다.
#
# 시각: 하루 두 번 — **KST 18:11**과 **KST 00:11** (2026-09-15 사용자 결정).
#   · 18:11 — K팝 발매는 대개 KST 18시다. 발매 직후에 바로 집는다.
#   · 00:11 — 자정 발매·해외 발매분 + 18:11에 스포티파이 반영이 늦어 놓친 것을 6시간 뒤 다시 집는다.
# ⚠️ 분이 :00이 아닌 건 실수가 아니다. GitHub의 schedule 이벤트는 정시에 부하가 몰려 **드랍이 잦다**
#    (실측: sync-hourly가 '30 * * * *'로 17시간에 4번만 돌았다). 라운드 분을 피한다.
#
# ⚠️ 정정(2026-09-15 실측): 처음엔 "스포티파이는 일일 쿼터 상한이 없다"고 적었는데 **틀렸다**.
#    신규 앱은 `/artists/{id}/albums`를 약 100회 부르면 429 + Retry-After ≈ 24시간이 떨어진다.
#    그래서 회차를 늘리는 게 공짜가 아니고, 한 회차에 도는 양도 예산으로 묶어야 한다.
#    자세한 실측은 tools/spotify_auth.mjs 머리 주석 참고.
# 한 번 밀려도 유실은 없다: 매 실행이 "우리 데이터에 없는 앨범"을 집어오고 어디까지 훑었는지 커서를
# 남기므로, 건너뛴 회차분은 다음 실행이 이어서 가져온다.

on:
  schedule:
    - cron: '11 9 * * *'    # KST 18:11 — 발매 직후
    - cron: '11 15 * * *'   # KST 00:11 — 자정/해외 발매 + 앞 회차 누락분
  workflow_dispatch:

concurrency:
  group: disco-daily
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 신선도 감시
        run: node tools/disco_freshness.mjs
