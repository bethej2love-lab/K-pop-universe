name: 앨범 수집 (매일)

# 디스코그래피 일일 파이프라인.
#
# 지금 들어 있는 것: 신선도 감시(tools/disco_freshness.mjs) — "앨범 수집이 멈췄다"를 아무도 안 보고
# 있어도 알아채는 장치. 임계를 넘으면 이 워크플로가 **실패**하고, 기본 알림 설정이면 메일이 온다.
# 대시보드를 하나 더 만들지 않는 게 요점이다(안 보는 대시보드가 제일 나쁘다).
#
# 곧 들어올 것: 스포티파이 신보 동기화(SPOTIFY_CLIENT_ID/SECRET 시크릿이 등록되면).
#   수집 → groups.json/artists.json 갱신 → 커밋 순서로 이 잡 앞에 붙는다. 파생물(disco/·slim·
#   tracks_index) 재생성은 그 커밋이 rebuild-disco-artifacts.yml을 깨워서 자동으로 이어진다.
#
# 시각: K팝 발매는 대개 **KST 18시**라, 1시간 버퍼를 두고 **KST 19시(=UTC 10시)**에 돈다
# (2026-09-15 사용자 결정). 스트리밍은 발매 시각에 바로 올라오므로 한 시간이면 충분하다.
# 라운드 분(:00)은 GitHub 부하가 몰려 드랍이 잦으므로 어긋난 분을 쓴다(sync-hourly.yml과 같은 이유).
#
# 하루 한 번이라 자정 발매·해외 발매는 최대 하루까지 늦어진다. 그게 문제가 되면 cron을 늘리면 된다 —
# 스포티파이 API는 유튜브와 달리 **일일 쿼터 상한이 없어서**(초당 요청 제한만 있다) 횟수가 비용이 아니다.
# 그리고 수집이 한 번 밀려도 유실은 없다: 매 실행이 "우리 데이터에 없는 앨범"을 전부 집어오므로
# 건너뛴 날치는 다음 실행이 한꺼번에 가져온다.

on:
  schedule:
    - cron: '11 10 * * *'
  workflow_dispatch:

concurrency:
  group: disco-daily
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 신선도 감시
        run: node tools/disco_freshness.mjs
