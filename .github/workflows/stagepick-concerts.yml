name: StagePick 공연 자동 수집

# 멜론티켓·인터파크/NOL 포함 케이팝 공연을 StagePick 캘린더에서 수집해 kpop_events에 저장.
# KOPIS는 정부 등록 공연만 커버해 주요 그룹이 빠지는 문제를 보완한다(2026-10-09 신설).
#
# 매월 1일 KST 09:00에 돌아 당월~3개월 뒤 일정을 수집한다.
# workflow_dispatch로 수동 실행도 가능(months 파라미터 조정 가능).

on:
  schedule:
    - cron: '0 0 * * *'    # 매일 UTC 00:00 = KST 09:00
  workflow_dispatch:
    inputs:
      months:
        description: '수집할 개월 수 (기본 4)'
        required: false
        default: '4'
      from:
        description: '시작 월 YYYY-MM (미지정 시 오늘 기준)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: StagePick 공연 수집 → Supabase 저장
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          MONTHS="${{ github.event.inputs.months || '4' }}"
          FROM="${{ github.event.inputs.from }}"
          ARGS="--months=${MONTHS} --direct"
          if [ -n "$FROM" ]; then ARGS="$ARGS --from=${FROM}"; fi
          node tools/stagepick_concerts.mjs $ARGS

      # 공연장 정보(좌석·위치) — 새로 나온 공연장만 조회(캐시 tools/venues_cache.json). 2026-10-22 자동화.
      # ⚠️ KOPIS_KEY 시크릿이 없으면 건너뛴다 — 키 없이 돌리면 국내 공연장이 전부 "못 찾음"으로 캐시돼 이후에도 안 채워진다.
      - name: 공연장 정보 갱신 + 커밋
        if: ${{ env.KOPIS_KEY != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node tools/build_venues.mjs | tail -20 | tee -a "$GITHUB_STEP_SUMMARY" || exit 1
            git add venues_info.json tools/venues_cache.json
            if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
            git commit -m "data(venues): 공연장 정보 갱신 (auto)"
            if git push; then exit 0; fi
            sleep $((i * 5))
          done
          exit 1
