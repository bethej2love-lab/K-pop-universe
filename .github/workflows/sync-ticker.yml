name: 동기화 티커

# ── 왜 있나 (2026-09-28) ─────────────────────────────────────────────────────
# sync-hourly는 cron을 시간당 4발(하루 96발) 쏘는데, 실측(9/26~27 48시간)으로 실제 만들어진 런은
# **13개**뿐이었다. GitHub schedule 이벤트가 통째로 드랍되는 건 우리 쪽에서 못 고친다. 결과: 공식 채널
# 업로드→적재 중앙값 2시간, 1시간 안 적재 23%, p90 5시간 — "매시간" 설계가 실제론 지켜지지 않았다.
#
# workflow_dispatch는 드랍되지 않는다. 그래서 러너 하나가 ~5시간 40분 떠 있으면서 **5분마다 게이트
# (tools/sync_gate.mjs)를 판정**하고, 돌 때가 됐을 때만 sync-hourly를 force로 발사한다. 간격 정책(낮 60분·
# 저녁 48분·새벽 무동기화)과 쿼터 계산은 게이트 한 곳에 그대로 있다 — 여기서 새로 정하는 게 없다.
# 끝날 때 자기 자신을 다시 발사해 체인을 잇고, 체인이 끊기면(러너 장애 등) 아래 cron이 한 시간 안에 되살린다.
# 매시간 워치독(sync-watchdog.yml)도 여기서 발사한다.
#
# ⚠️ GITHUB_TOKEN으로 만든 이벤트는 원래 새 런을 안 만들지만 workflow_dispatch는 예외다(공식 문서).
# ⚠️ 공개 레포라 러너 시간은 무료. 잡 한도 6시간 안에서 끊고(340분) 다음 티커로 넘긴다.
on:
  schedule:
    - cron: '41 * * * *'   # 체인이 끊겼을 때 되살리는 예비 발화(평소엔 대기열에서 다음 차례로 합쳐짐)
  workflow_dispatch:

permissions:
  actions: write   # sync-hourly·watchdog·자기 자신 발사 + 게이트의 daily-routine 실행 여부 조회
  contents: read

# 티커는 항상 하나만. cancel-in-progress=false — 도는 티커를 끊지 않고, 뒤에 온 것은 대기(가장 최근 1개만 남음).
concurrency:
  group: sync-ticker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 5분마다 게이트 판정 → 필요할 때만 동기화 발사
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          end=$(( $(date +%s) + 340*60 ))
          i=0
          while [ "$(date +%s)" -lt "$end" ]; do
            out=$(mktemp)
            # 게이트가 통과시키면 last_sync_attempt 표식을 남기므로, 발사하는 sync-hourly는 force로 보낸다
            # (안 그러면 그쪽 게이트가 "방금 시도함"으로 스스로 건너뛴다).
            if GITHUB_OUTPUT="$out" node tools/sync_gate.mjs && grep -q '^run=true' "$out"; then
              gh workflow run sync-hourly.yml --ref main -R "$GH_REPO" -f force=true \
                && echo "[ticker] $(date -u +%H:%MZ) 동기화 발사" \
                || echo "::warning::sync-hourly 발사 실패 — 다음 틱에 게이트가 다시 판정"
            fi
            rm -f "$out"
            # 매시간 워치독(12틱 = 60분). 첫 틱에도 한 번.
            if [ $((i % 12)) -eq 0 ]; then gh workflow run sync-watchdog.yml --ref main -R "$GH_REPO" || true; fi
            i=$((i+1))
            sleep 300
          done
          gh workflow run sync-ticker.yml --ref main -R "$GH_REPO"
