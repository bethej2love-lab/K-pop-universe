name: 멤버 솔로 디스코 순찰 (요일별 1/7)

# 그룹 멤버 솔로 앨범 수집(2026-11-11 사용자 "ㄱㄱ").
# 왜: 매일 신보 수집(disco-daily의 melon_new_releases)은 멜론 '최신 앨범' 목록만 본다. 그런데 그 목록에
#     아예 안 올라오는 앨범이 있다 — 샤오쥔 'Hey, Somebody'(2026.10.26 미니 1집)가 국내·해외 목록 어디에도 없었고,
#     같은 방식으로 다시 훑자 임영민 6장·정인성 3장도 빠져 있었다. 스포티파이 수집은 그룹 멤버 솔로를 안 본다.
# 방법: tools/melon_member_solo_disco.mjs(그룹 멜론 멤버 명단 → 멤버 aid → 앨범 목록, 동명이인 없음)를
#     요일별로 그룹 1/7씩(--shard 요일/7, 40팀 안팎 · 요청 500개 안팎) 돌린다 → 그룹마다 주 1회.
#     한 번에 전부(요청 1,600여 개)를 돌리면 멜론이 IP를 막는다(2026-09-17 실측 ~2,400요청).
# ⚠️ 러너(해외 IP)에서 멜론이 막히면 도구가 연속 차단을 보고 접는다 — 그날 몫은 다음 주로 밀릴 뿐 틀린 데이터는 안 들어간다.
# ⚠️ 커밋 전 출처 불변식(tests/disco-provenance.test.js)을 통과해야 커밋한다 — disco-daily와 같은 마지막 벽.
# ⚠️ GITHUB_TOKEN push는 다른 워크플로를 깨우지 않는다 → 파생물(slim·disco/)을 같은 잡에서 직접 만든다(disco-daily 주석).

on:
  schedule:
    - cron: '37 19 * * *'   # 매일 KST 04:37 — 다른 수집과 겹치지 않는 시간
  workflow_dispatch:
    inputs:
      shard:
        description: "몫 번호 0~6 (비우면 오늘 요일)"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: member-solo-disco
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 멤버 솔로 앨범 수집
        continue-on-error: true
        timeout-minutes: 20
        run: |
          SHARD="${{ github.event.inputs.shard }}"
          if [ -z "$SHARD" ]; then SHARD=$(TZ=Asia/Seoul date +%w); fi
          echo "몫 $SHARD/7"
          node tools/melon_member_solo_disco.mjs --shard "$SHARD/7" --apply | tee -a "$GITHUB_STEP_SUMMARY"
          R="$HOME/Downloads/melon_disco_audit/melon_member_solo_report.txt"
          if [ -f "$R" ]; then echo '```' >> "$GITHUB_STEP_SUMMARY"; grep -a "추가 [1-9]" "$R" >> "$GITHUB_STEP_SUMMARY" || true; echo '```' >> "$GITHUB_STEP_SUMMARY"; fi

      - name: 출처 불변식 확인(실패 시 커밋 안 함)
        run: node tests/disco-provenance.test.js

      - name: 파생물 재생성 + 수집분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node tools/build_slim_data.mjs
          git add artists.json melon_artist_map.json
          git add groups.slim.json artists.slim.json tracks_index.json albums_recent.json disco/
          if git diff --cached --quiet; then
            echo "새 앨범 없음 — 커밋할 것이 없습니다"
            exit 0
          fi
          git commit -m "data(disco): 멤버 솔로 앨범 순찰 (auto)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push 경합 — 재시도 ($i/3)"; sleep $((i * 5))
          done
          exit 1
